            --ink: #14161a;
            --body: #33383f;
            --muted: #6b747d;
            --accent: #0b6e6d;
            --line: #dfe4e8;
            --chip: #f2f5f7;
            --rule: #c9d2d7;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #e9edf0;
            color: var(--body);
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        }

        /* ---------- toolbar (screen only) ---------- */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #060607;
        }
        .toolbar-actions { display: flex; gap: 10px; }
        .toolbar a,
        .toolbar button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 9px 18px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .toolbar .back {
            color: #9aa6ad;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: none;
        }
        .toolbar .back:hover { color: #fff; border-color: #00f0ef; }
        .toolbar .download {
            background: linear-gradient(90deg, #00f0ef, #0fb1aa);
            color: #000;
            border: none;
        }
        .toolbar .download:hover { box-shadow: 0 4px 18px rgba(0, 240, 239, 0.45); }

        /* ---------- sheet ---------- */
        .sheet {
            width: 210mm;
            max-width: 100%;
            margin: 22px auto 44px;
            background: #fff;
            padding: 13mm 14mm 11mm;
            box-shadow: 0 12px 44px rgba(20, 30, 40, 0.14);
            border-radius: 4px;
        }

        /* ---------- header ---------- */
        .cv-head {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 16px;
            align-items: center;
            padding-bottom: 11px;
            border-bottom: 2.5px solid var(--accent);
        }
        .cv-head.no-photo { grid-template-columns: 1fr; }

        .photo {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 22%;
            border: 2.5px solid var(--accent);
            display: block;
        }

        .name {
            margin: 0;
            font-size: 29px;
            font-weight: 700;
            letter-spacing: -0.022em;
            line-height: 1.08;
            color: var(--ink);
        }
        .role-line {
            margin: 3px 0 0;
            font-size: 13.2px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.005em;
        }
        .contact-line {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 10.3px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px 8px;
        }
        .contact-line a { color: var(--body); text-decoration: none; }
        .contact-line .sep { color: var(--rule); }

        /* ---------- sections ---------- */
        h2 {
            font-size: 9.8px;
            text-transform: uppercase;
            letter-spacing: 0.155em;
            font-weight: 700;
            color: var(--accent);
            margin: 12px 0 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--line);
        }

        .summary {
            margin: 0;
            font-size: 11.1px;
            line-height: 1.5;
            color: var(--body);
        }

        /* ---------- key achievements ---------- */
        .wins {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 22px;
        }
        .wins li {
            position: relative;
            padding-left: 15px;
            font-size: 10.8px;
            line-height: 1.42;
            color: var(--body);
        }
        .wins li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 5.5px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }
        .wins b { color: var(--ink); font-weight: 700; }

        /* ---------- experience ---------- */
        .job { margin-bottom: 9px; break-inside: avoid; page-break-inside: avoid; }
        .job:last-child { margin-bottom: 0; }

        .job-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 14px;
        }
        .job-title { margin: 0; font-size: 11.8px; font-weight: 700; color: var(--ink); }
        .job-title .role { color: var(--accent); font-weight: 600; }
        .job-meta {
            font-size: 9.9px;
            color: var(--muted);
            white-space: nowrap;
            font-weight: 500;
            text-align: right;
        }
        .job ul { margin: 4px 0 0; padding: 0; list-style: none; }
        .job li {
            position: relative;
            padding-left: 12px;
            margin-bottom: 2px;
            font-size: 10.7px;
            line-height: 1.44;
        }
        .job li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 6px;
            width: 3.5px;
            height: 3.5px;
            border-radius: 50%;
            background: var(--rule);
        }
        .job li b { color: var(--ink); font-weight: 600; }
        .stack-line {
            margin: 4px 0 0;
            font-size: 9.9px;
            color: var(--muted);
        }
        .stack-line b { color: var(--body); font-weight: 600; }

        /* ---------- skills ---------- */
        .skills-grid {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 6px 12px;
            margin: 0;
            align-items: start;
        }
        .skills-grid dt {
            font-weight: 600;
            font-size: 10.2px;
            color: var(--ink);
            padding-top: 2px;
        }
        .skills-grid dd { margin: 0; display: flex; flex-wrap: wrap; gap: 3.5px; }
        .chip {
            display: inline-block;
            background: var(--chip);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 9.9px;
            color: var(--body);
            white-space: nowrap;
        }

        /* ---------- bottom row: education + languages ---------- */
        .bottom-row {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 0 26px;
            align-items: start;
        }
        .edu-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 10.7px;
        }
        .edu-row:last-child { margin-bottom: 0; }
        .edu-row strong { color: var(--ink); font-weight: 600; }
        .edu-row .when { color: var(--muted); font-size: 9.9px; white-space: nowrap; }
        .lang-list { margin: 0; font-size: 10.7px; }
        .lang-list div { margin-bottom: 4px; }
        .lang-list strong { color: var(--ink); font-weight: 600; }

        /* ---------- responsive (screen only — must NOT apply to print:
           A4 is ~794px wide, which would otherwise collapse every 2-col block) ---------- */
        @media screen and (max-width: 700px) {
            .sheet { width: auto; margin: 12px; padding: 20px 16px; }
            .wins { grid-template-columns: 1fr; }
            .skills-grid { grid-template-columns: 1fr; gap: 2px 0; }
            .skills-grid dt { margin-top: 7px; }
            .bottom-row { grid-template-columns: 1fr; gap: 0; }
            .job-head { flex-direction: column; gap: 1px; }
            .job-meta { text-align: left; }
        }

        /* ---------- print ---------- */
        @page { size: A4; margin: 0; }

        @media print {
            .toolbar { display: none !important; }
            html, body { background: #fff; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .sheet {
                width: auto;
                max-width: none;
                margin: 0;
                border-radius: 0;
                box-shadow: none;
                padding: 9mm 13mm 7mm;
            }
            a { color: var(--body); }
            h2 { break-after: avoid; page-break-after: avoid; }
        }
    </style>
</head>

            document.getElementById("r-expH").textContent = t.expH;
            document.getElementById("r-skillsH").textContent = t.skillsH;
            document.getElementById("r-eduH").textContent = t.eduH;
            document.getElementById("r-langH").textContent = t.langH;

            document.getElementById("r-contacts").innerHTML = t.contacts.map(c =>
                c.href ? `<a href="${c.href}">${c.text}</a>` : `<span>${c.text}</span>`
            ).join('<span class="sep">·</span>');

            document.getElementById("r-wins").innerHTML =
                t.wins.map(w => `<li>${w}</li>`).join("");

            document.getElementById("r-jobs").innerHTML = t.jobs.map(j => {
                const bullets = j.bullets.map(b => `<li>${b}</li>`).join("");
                const stack = j.stack ? `<p class="stack-line"><b>Stack:</b> ${j.stack}</p>` : "";
                const fmt = j.format ? `<br />${j.format}` : "";
                return `<div class="job">
                    <div class="job-head">
                        <h3 class="job-title">${j.company} — <span class="role">${j.role}</span></h3>
                        <div class="job-meta">${j.time}${fmt}</div>
                    </div>
                    <ul>${bullets}</ul>${stack}
                </div>`;
            }).join("");

            document.getElementById("r-skills").innerHTML = t.skills.map(s =>
                `<dt>${s.dt}</dt><dd>${s.chips.map(c => `<span class="chip">${c}</span>`).join("")}</dd>`
            ).join("");

            document.getElementById("r-edu").innerHTML = t.edu.map(e =>
                `<div class="edu-row"><span><strong>${e.name}</strong> — ${e.desc}</span><span class="when">${e.time}</span></div>`
            ).join("");

            document.getElementById("r-langs").innerHTML = t.langs.map(l =>
                `<div><strong>${l.name}</strong> — ${l.level}</div>`
            ).join("");

            /* photo: on for RU (hh.kz norm), off for EN (EU/LinkedIn norm); ?photo= overrides */
            const ov = photoOverride();
            const want = ov === null ? t.showPhoto : ov;
            setPhoto(want);

            const backBtn = document.getElementById("backBtn");
            const langBtn = document.getElementById("langBtn");
            const dlBtn = document.getElementById("dlBtn");
            backBtn.textContent = t.ui.back;
            langBtn.textContent = t.ui.langBtn;
            dlBtn.textContent = t.ui.download;
            dlBtn.dataset.file = lang === "ru" ? "resume-ru.pdf" : "resume-en.pdf";
            dlBtn.dataset.name = t.ui.fileName;
        }

        function setPhoto(show) {
            const img = document.getElementById("cvPhoto");
            const head = document.getElementById("cvHead");
            if (!show) {
                img.style.display = "none";
                head.classList.add("no-photo");
                return;
            }
            img.style.display = "";
            head.classList.remove("no-photo");
        }

        /* if img/photo.jpg is missing, drop the photo slot so the header stays clean */
        document.getElementById("cvPhoto").addEventListener("error", () => setPhoto(false));

        let currentLang = getLang();
        render(currentLang);

        document.getElementById("langBtn").addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            localStorage.setItem("language", currentLang);
            render(currentLang);
        });

        document.getElementById("dlBtn").addEventListener("click", () => {
            const btn = document.getElementById("dlBtn");
            const a = document.createElement("a");
            a.href = btn.dataset.file;
            a.download = btn.dataset.name;
            document.body.appendChild(a);
            a.click();
            a.remove();
        });
    </script>
</body>

</html>
